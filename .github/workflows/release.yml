# Builds the plugin for Windows (x64) first, then macOS as a universal
# (arm64 + x86_64) binary, merges both into the single cross-platform
# .bundle, codesigns + notarizes the mac binary, and publishes a GitHub
# Release with the zip and dmg attached.
#
# Trigger: push a tag matching v*.*.* (either by hand, or via bump-version.yml).
# You can also run it manually against an existing tag with workflow_dispatch.

name: Build & Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v2.3.0)
        required: true

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: CPP Markdown
  XCODE_PROJECT: CPP Markdown.xcodeproj
  VCX_SOLUTION: CPP Markdown.sln
  MACOS_DEPLOYMENT_TARGET: '10.13'
  # --------------------------------------------------------------

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The project's own .vcxproj hardcodes its Boost include path to the
      # original author's own machine:
      #   C:\Users\miyako\Documents\vcpkg\vcpkg-master\installed\x64-windows-static\include
      # which isn't provided anywhere in this workflow, so the compile fails
      # at markdown.h's `#include <boost/noncopyable.hpp>`.
      #
      # Fix: install vcpkg to that exact path (so the existing hardcoded
      # include dir resolves with zero .vcxproj edits to that setting).
      #
      # Boost is header-only-in-practice for this project's needs on this
      # vcpkg snapshot: three real CI runs chasing a compiled
      # `boost_regex-*.lib` (guessed filename, then guessed directory, then
      # a full recursive search) all came up empty, and the last one's
      # directory dump confirmed why — `boost-regex_x64-windows-static`'s
      # package folder here contains only `include/`, `share/`, `BUILD_INFO`,
      # `CONTROL`, no `lib/` at all. This vcpkg snapshot's Boost.Regex port
      # doesn't produce a compiled library for this triplet. The matching
      # fix is on the .vcxproj side (see its own comment) — this step now
      # only installs headers.
      #
      # boost-regex/boost-optional alone got the build one step further, then
      # failed on `boost/shared_ptr.hpp` — installing two of the ~8 Boost
      # headers this project's source actually includes was itself a partial
      # fix. Checked every compiled file's includes directly (markdown.h,
      # markdown.cpp, markdown-tokens.cpp, markdown-tokens.h, plus the
      # plugin's own .h) rather than adding packages one failing header at a
      # time, to install the complete set in this one pass:
      #   boost/noncopyable.hpp                -> boost-core
      #   boost/shared_ptr.hpp                 -> boost-smart-ptr
      #   boost/optional.hpp                   -> boost-optional (already had)
      #   boost/unordered_map.hpp, unordered_set.hpp -> boost-unordered
      #   boost/regex.hpp                      -> boost-regex (already had)
      #   boost/lexical_cast.hpp               -> boost-lexical-cast
      #   boost/algorithm/string/case_conv.hpp  -> boost-algorithm
      - name: install Boost (vcpkg)
        shell: pwsh
        run: |
          $vcpkgRoot = "C:\Users\miyako\Documents\vcpkg\vcpkg-master"
          New-Item -ItemType Directory -Force -Path (Split-Path $vcpkgRoot) | Out-Null
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & "$vcpkgRoot\bootstrap-vcpkg.bat"
          & "$vcpkgRoot\vcpkg.exe" install `
            boost-core:x64-windows-static `
            boost-smart-ptr:x64-windows-static `
            boost-optional:x64-windows-static `
            boost-unordered:x64-windows-static `
            boost-regex:x64-windows-static `
            boost-lexical-cast:x64-windows-static `
            boost-algorithm:x64-windows-static

      # GitHub-hosted windows-latest ships VS2022 (v143 toolset) but not the
      # legacy v140 toolset the project is pinned to, so we override it on
      # the command line rather than requiring an extra VS component install.
      #
      # The project also hardcodes WindowsTargetPlatformVersion=8.1 in
      # TZ.vcxproj (<PropertyGroup Label="Globals">), and the Windows 8.1 SDK
      # is no longer installed on current windows-latest images, which fails
      # with MSB8036 ("The Windows SDK version 8.1 was not found"). Same class
      # of fix as the toolset override above: override it on the command line
      # rather than editing the vcxproj (which applies to all 4
      # Debug/Release x Win32/x64 configurations, not just the one this job
      # builds). "10.0" lets MSBuild resolve to whatever full 10.0.xxxxx.x SDK
      # is actually installed on the runner, rather than pinning an exact
      # build number that may not match the image.
      - name: build x64
        shell: cmd
        run: msbuild "${{ env.VCX_SOLUTION }}" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            test/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      # Same underlying issue as the Windows job's Boost step, different
      # shape: the project's own .xcodeproj (all three build configs) sets
      #   SYSTEM_HEADER_SEARCH_PATHS = /usr/local/Cellar/boost/1.72.0/include
      # a hardcoded old-Homebrew-Intel path never provisioned on this
      # runner. Unlike Windows, the compiled library isn't missing here —
      # `a/libboost_regex.a` is actually vendored in the repo already, and
      # LIBRARY_SEARCH_PATHS references it via `$(PROJECT_DIR)/a` (no
      # personal-machine path on the library side, only the header side).
      #
      # So only headers are needed, but the EXACT version matters more here
      # than it did for Windows' header-only vcpkg fix: this vendored .a is
      # a real compiled binary, presumably built against Boost 1.72.0
      # specifically (per the hardcoded folder name). Mixing it with a
      # different Boost version's headers risks the header/binary ABI-split
      # failure class this playbook already catalogs elsewhere (mismatched
      # class layouts/symbols between a vendored binary and newer headers)
      # — so this fetches that exact tagged version from source, with
      # submodules (Boost's superproject splits each library into its own
      # repo), rather than installing whatever Homebrew's current boost
      # formula happens to ship.
      - name: install Boost 1.72.0 headers (matching vendored libboost_regex.a)
        run: |
          set -euo pipefail
          git clone --recurse-submodules --shallow-submodules --depth 1 \
            --branch boost-1.72.0 https://github.com/boostorg/boost.git /tmp/boost-1.72.0

          # The superproject clone only gives each submodule its own separate
          # include tree (libs/regex/include/boost/, libs/core/include/boost/,
          # ...) — there's no unified top-level boost/ folder until Boost's
          # own build tool generates one. `b2 headers` is what actually
          # collates every submodule's include/boost/* into a single
          # boost/ directory; skipping it (assuming the clone alone produces
          # boost/) failed a real CI run here with
          # "cp: /tmp/boost-1.72.0/boost: No such file or directory".
          cd /tmp/boost-1.72.0
          ./bootstrap.sh
          ./b2 headers

          sudo mkdir -p /usr/local/Cellar/boost/1.72.0/include
          sudo cp -R /tmp/boost-1.72.0/boost /usr/local/Cellar/boost/1.72.0/include/boost

      - name: build macOS plugin (universal)
        run: |
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BIN="test/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64" && lipo -info "$BIN" | grep -q "x86_64"

      - name: merge Windows binaries into the bundle
        run: |
          set -euo pipefail
          BUNDLE="test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          mkdir -p "$BUNDLE/Contents/Windows64"
          cp "winbuild/${{ env.PRODUCT_NAME }}.4DX" "$BUNDLE/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX"
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
